[workspace]
resolver = "2"
members = ["crates/ramview-core", "crates/ramview-platform", "crates/ramview-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/s13mjl/RAMView-Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
