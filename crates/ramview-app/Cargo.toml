[package]
name = "ramview-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "RAMView HUD binary: Win32 layered window with a GDI-rendered squarified treemap."

[[bin]]
name = "RAMView"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"

[dependencies]
ramview-core = { path = "../ramview-core" }
ramview-platform = { path = "../ramview-platform" }
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
